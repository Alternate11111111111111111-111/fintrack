<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login - FinTrack Pro</title>
  </head>
  <body>
    <main class="h-[100vh] w-[100vw] flex items-center justify-center bg-gray-100">
      <div class="flex flex-col justify-evenly h-[65%] w-[30%] border-none rounded-xl shadow-xl p-4 bg-white">
        <h2 class="text-2xl font-bold self-center">Welcome Back</h2>
        <h4 class="text-lg self-center ">Login to FinTrack Pro</h4>
        <form action="" class="flex flex-col gap-2 ">
          <label for="username">Username</label>
          <input type="text" class="usr h-10 w-full border border-gray-300 rounded-lg" required/>
          <label for="password">Password</label>
          <input type="password" class="pass h-10 w-full border border-gray-300 rounded-lg" required/>

          <button class="h-10 w-full border-none rounded-lg bg-blue-700 text-white text-md ">Login</button>
        </form>
        <h5 class="self-center text-sm">
          Don't have an account? <a href="./register.html" class="text-blue-700">Register here</a>
        </h5>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>

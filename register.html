<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Register - FinTrack Pro</title>
  </head>
  <body>
    <main class="h-[100vh] w-[100vw] flex items-center justify-center bg-gray-100">
      <div class="flex flex-col justify-evenly h-[65%] w-[30%] border-none rounded-xl shadow-xl p-4 bg-white">
        <h2 class="text-2xl font-bold self-center">Create Account</h2>
        <h4 class="text-lg self-center ">Join FinTrack Pro</h4>
        <form action="" class="flex flex-col gap-2 ">
          <label for="username">Choose a Username</label>
          <input type="text" class="h-10 w-full border border-gray-300 rounded-lg"/>
          <label for="password">Password</label>
          <input type="password" class="h-10 w-full border border-gray-300 rounded-lg"/>

          <button class="h-10 w-full border-none rounded-lg bg-green-600 text-white text-md ">Register</button>
        </form>
        <h5 class="self-center text-sm">
          Already have an account?<a href="./index.html" class="text-blue-700">Login here</a>
        </h5>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
